<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupixis Timer · Broadcast graphic</title>
  <link rel="icon" href="/shared/icon.svg">
  <link rel="stylesheet" href="/overlay/overlay.css">
  <style id="fontFace"></style>
</head>
<!--
  Broadcast / public graphic. Designed on a 1920×1080 canvas and scaled to fit.
  Add as a Browser Source in OBS or vMix at 1920×1080. Background is transparent by default.
  URL options:
    ?bg=transparent|black|chroma|magenta   page background (default transparent)
    ?layout=fullscreen|lowerthird|bar|corner   force a layout regardless of the controller
    ?always=1    ignore On Air and always show (e.g. a dedicated LED/projector feed)
-->
<body>
  <div id="canvas">
    <div id="graphic" class="layout-fullscreen">
      <div class="bgfill"></div>
      <div class="panel">
        <!-- Big ring around the time (full-screen layout, ring progress) -->
        <svg class="ring ring-big" viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="46"/><circle class="ring-fill" cx="50" cy="50" r="46" pathLength="100"/></svg>
        <img class="logo" alt="">
        <div class="texts">
          <div class="label"></div>
          <div class="timerow">
            <!-- Small ring next to the time (other layouts, ring progress) -->
            <svg class="ring ring-mini" viewBox="0 0 100 100"><circle class="ring-track" cx="50" cy="50" r="40"/><circle class="ring-fill" cx="50" cy="50" r="40" pathLength="100"/></svg>
            <div class="time"></div>
          </div>
          <div class="sublabel"></div>
        </div>
        <div class="bar"><div class="fill"></div></div>
      </div>
    </div>
  </div>
  <script type="module" src="/overlay/overlay.js"></script>
</body>
</html>
